*{box-sizing:border-box}body{margin:0;background:#111820;color:#f5f1e9;font:16px system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-shrink:0}header strong{font-size:17px;letter-spacing:2px}.toolbar{display:flex;gap:6px}button{cursor:pointer;color:inherit;background:#25313c;border:1px solid #3b4854;border-radius:10px;padding:10px;font:inherit;min-height:44px}button:hover{border-color:#f2d59b}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #f2d59b;outline-offset:3px}.toolbar button{width:44px;padding:10px}.toolbar svg, .close svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}main{flex:1;min-height:0;padding:4px 16px 12px;display:flex;align-items:center;justify-content:center}.poster-wrap{position:relative;aspect-ratio:2/3;width:min(100%,calc((100dvh - 96px - env(safe-area-inset-top) - env(safe-area-inset-bottom))*2/3),600px);height:auto;max-height:100%;box-shadow:0 12px 40px #0007}canvas{display:block;width:100%;height:100%}.hotspot{position:absolute;left:0;width:100%;background:transparent;border:0;border-radius:0;padding:0}.hotspot:hover{background:#ffffff08;border:0}.hotspot:focus-visible{outline-offset:-4px}.symbol-hit{top:0;height:28%}.text-hit{top:28%;height:62%}.bg-hit{top:90%;height:10%}.hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);padding:3px 8px;background:#0005;color:#fff;border-radius:20px;font-size:11px;pointer-events:none;white-space:nowrap}dialog{color:#f5f1e9;background:#18222c;border:1px solid #3b4854;border-radius:18px;width:min(440px,calc(100% - 24px));max-height:85dvh;padding:20px;overflow:auto}dialog::backdrop{background:#0009;backdrop-filter:blur(4px)}.dialog-top{display:flex;alig <dialog id="bgDialog"><div class="dialog-top"><h2>Fundo</h2><button class="close" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="bgPalette" class="swatches"></div><div class="colorrow"><input id="bg" type="color" value="#c92333" aria-label="Cor do fundo">Cor livre</div></dialog><p id="status" aria-live="polite"></p><script>
const $=id=>document.getElementById(id),canvas=$('poster'),ctx=canvas.getContext('2d');
const defaults={heading:'KEEP\nCALM\nAND',message:'CARRY ON',bg:'#c92333',fg:'#ffffff',symbol:'crown',show:true};let state={...defaults};try{let v=JSON.parse(localStorage.getItem('keep-calm-v1'));if(v&&typeof v==='object')for(const k of Object.keys(defaults))if(typeof v[k]===typeof defaults[k])state[k]=v[k]}catch{}
const paths={crown:'M12 10 L24 26 L38 13 L50 28 L62 13 L76 26 L88 10 L80 65 L20 65 Z M20 72 H80 V84 H20 Z M46 2 H54 V10 H62 V18 H54 V26 H46 V18 H38 V10 H46 Z',heart:'M50 88 C38 76 6 54 6 29 C6 4 36 1 50 24 C64 1 94 4 94 29 C94 54 62 76 50 88 Z',plane:'M44 8 Q50 0 56 8 L58 38 L94 60 V69 L58 58 L57 79 L72 90 V97 L50 89 L28 97 V90 L43 79 L42 58 L6 69 V60 L42 38 Z',coffee:'M15 26 H70 V66 Q70 86 43 86 Q15 86 15 66 Z M70 33 H84 Q99 33 99 50 Q99 68 70 68 V58 Q89 58 89 50 Q89 43 70 43 Z M7 91 H83 V97 H7 Z M26 4 H32 V19 H26 Z M44 0 H50 V19 H44 Z M62 4 H68 V19 H62 Z',cup:'M26 8 H74 V22 H90 V38 Q90 60 68 64 Q63 74 55 77 V87 H72 V96 H28 V87 H45 V77 Q37 74 32 64 Q10 60 10 38 V22 H26 Z M26 32 H20 V38 Q20 49 28 52 Z M74 32 L72 52 Q80 49 80 38 V32 Z'};
for(const [id,emoji,name]of [['crown','👑','Coroa'],['heart','❤️','Coração'],['plane','✈️','Avião'],['coffee','☕','Café'],['cup','🏆','Taça']]){let b=document.createElement('button');b.textContent=emoji;b.title=name;b.setAttribute('aria-label',name);b.dataset.symbol=id;b.onclick=()=>{state.symbol=id;update()};$('symbols').append(b)}
const colors=['#c92333','#ed6745','#edb64a','#f2d59b','#ffffff','#e5e7eb','#1a7a68','#2463a0','#493575','#d784b0','#283440','#000000'];for(const [target,key]of [['bgPalette','bg'],['fgPalette','fg']])for(const color of colors){let b=document.createElement('button');b.className='swatch';b.style.background=color;b.title=color;b.setAttribute('aria-label','Escolher '+color);b.dataset.color=color;b.onclick=()=>{state[key]=color;update()};$(target).append(b)}
function wrap(text,size){ctx.font=`700 ${size}px "Arial Narrow", "Liberation Sans Narrow", Arial, sans-serif`;let lines=[];for(const para of text.toUpperCase().split('\n')){if(!para.trim()){lines.push('');continue}let line='';for(const word of para.trim().split(/\s+/)){if(ctx.measureText(word).width>1620){if(line){lines.push(line);line=''}let chunk='';for(const ch of word){if(ctx.measureText(chunk+ch).width>1620&&chunk){lines.push(chunk);chunk=''}chunk+=ch}line=chunk}else if(line&&ctx.measureText(line+' '+word).width>1620){lines.push(line);line=word}else line+=(line?' ':'')+word}lines.push(line)}return lines}
function draw(){ctx.fillStyle=state.bg;ctx.fillRect(0,0,2000,3000);ctx.fillStyle=state.fg;if(state.show){ctx.save();ctx.translate(790,285);ctx.scale(4.2,4.2);ctx.fill(new Path2D(paths[state.symbol]||paths.crown),'evenodd');ctx.restore()}let size=265,lines;const top=state.show?900:450,bottom=2700;do{lines=[...wrap(state.heading,size).map(t=>({t,small:t.trim()==='AND'})),...wrap(state.message,size).map(t=>({t,small:false}))];if(lines.reduce((n,l)=>n+size*(l.small?.77:1.2),0)<=bottom-top)break;size-=3}while(size>12);let height=lines.reduce((n,l)=>n+size*(l.small?.77:1.2),0),y=top+(bottom-top-height)/2;ctx.textAlign='center';ctx.textBaseline='middle';for(const l of lines){let step=size*(l.small?.77:1.2);ctx.font=`700 ${l.small?size*.57:size}px "Arial Narrow", "Liberation Sans Narrow", Arial, sans-serif`;ctx.fillText(l.t,1000,y+step/2);y+=step}canvas.setAttribute('aria-label',(state.heading+' '+state.message).replace(/\n/g,' '))}
function update(){for(const k of ['heading','message','bg','fg'])$(k).value=state[k];$('show').checked=state.show;document.querySelectorAll('[data-symbol]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.symbol===state.symbol));for(const [id,key]of [['bgPalette','bg'],['fgPalette','fg']])$(id).querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.color===state[key]));draw();try{localStorage.setItem('keep-calm-v1',JSON.stringify(state))}catch{}}
for(const k of ['heading','message','bg','fg','show'])$(k).oninput=()=>{state[k]=k==='show'?$(k).checked:$(k).value;update()};$('reset').onclick=()=>{state={...defaults};update()};
const blob=()=>new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Não foi possível gerar a imagem.')),'image/png'));
async function download(){try{let b=await blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='keep-calm.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);$('status').textContent='PNG pronto: 2000 × 3000 píxeis.'}catch(e){$('status').textContent=e.message}}
$('download').onclick=download;$('share').onclick=async()=>{try{let file=new File([await blob()],'keep-calm.png',{type:'image/png'});if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'Keep Calm'});else{await download();$('status').textContent='Partilha directa indisponível. Usa o PNG descarregado.'}}catch(e){if(e.name!=='AbortError')$('status').textContent='Não foi possível partilhar. Usa Descarregar PNG.'}};
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>$(b.dataset.open).showModal());document.querySelectorAll('dialog').forEach(d=>{d.querySelector('.close').onclick=()=>d.close();d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}})});let statusTimer;new MutationObserver(()=>{clearTimeout(statusTimer);if($('status').textContent)statusTimer=setTimeout(()=>$('status').textContent='',5000)}).observe($('status'),{childList:true});let installEvent;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;$('install').hidden=false});$('install').onclick=async()=>{if(installEvent){await installEvent.prompt();installEvent=null;$('install').hidden=true}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update()})}).catch(()=>{});update();
